<div class="qa-card"
     [style.width.px]="width()"
     [style.height.px]="height()">
  <div class="accent-bar" [style.background]="color()"></div>

  <div class="card-body">
    <div class="card-top">
      <span class="qa-badge">QA</span>
      <span class="qa-id" [style.color]="color()">{{ node().data['pbiId'] }}</span>
      @if (node().data['testerName']) {
        <span class="qa-tester" [title]="node().data['testerName']">{{ node().data['testerName'] }}</span>
      }
    </div>
    @if (node().data['pbiTitle']) {
      <div class="qa-title" [title]="node().data['pbiTitle']">{{ node().data['pbiTitle'] }}</div>
    }
    <div class="qa-date">{{ fromLabel() }}</div>
  </div>

  <ng-diagram-port id="qa-in"      [type]="'target'" [side]="'top'">
    <div class="port"></div>
  </ng-diagram-port>
  <ng-diagram-port id="qa-in-left" [type]="'target'" [side]="'left'">
    <div class="port"></div>
  </ng-diagram-port>
</div>
